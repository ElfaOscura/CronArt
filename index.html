<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CronArt</title>
<meta name="theme-color" content="#3730a3">
<meta name="description" content="CronArt: planificador visual para ilustradores. Calendario con post-its, tablero Kanban y efemérides.">
<link rel="canonical" href="https://TU-USUARIO.github.io/cronart/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CronArt">
<meta property="og:title" content="CronArt · Planificador para ilustradores">
<meta property="og:description" content="Calendario con post-its, tablero Kanban y efemérides para organizar tus dibujos.">
<meta property="og:url" content="https://TU-USUARIO.github.io/cronart/">
<meta property="og:image" content="https://TU-USUARIO.github.io/cronart/icons/og-image.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Icono de CronArt: una nota con un pincel">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CronArt · Planificador para ilustradores">
<meta name="twitter:description" content="Calendario con post-its, tablero Kanban y efemérides para organizar tus dibujos.">
<meta name="twitter:image" content="https://TU-USUARIO.github.io/cronart/icons/og-image.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geom:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-dvh flex flex-col">
<header class="top relative px-3 py-2 flex flex-wrap items-center gap-2">
  <h1 class="logo flex items-center gap-2"><span class="mark"><i data-lucide="brush"></i></span>CronArt</h1>
  <div class="flex gap-1 mx-auto" role="group">
    <button class="btn" data-mode="calendar" data-i18n-aria="calendar"><i data-lucide="calendar-days"></i><span class="hidden md:inline" data-i18n="calendar"></span></button>
    <button class="btn" data-mode="kanban" data-i18n-aria="kanban"><i data-lucide="kanban"></i><span class="hidden md:inline" data-i18n="kanban"></span></button>
  </div>
  <div class="flex gap-1 items-center">
    <button class="btn btn-p" id="btn-add" data-i18n-aria="add"><i data-lucide="plus"></i><span class="hidden lg:inline" data-i18n="add"></span></button>
    <button class="btn" id="btn-filter" aria-expanded="false" data-i18n-aria="filters"><i data-lucide="list-filter"></i><span class="hidden lg:inline" data-i18n="filters"></span></button>
    <button class="btn" id="btn-menu" aria-expanded="false" data-i18n-aria="settings"><i data-lucide="menu"></i></button>
  </div>
  <div id="filters" class="pop" hidden>
    <label class="block mb-2"><span class="lbl" data-i18n="search"></span><input id="fl-q" type="search" class="field" autocomplete="off"></label>
    <label class="block mb-2"><span class="lbl" data-i18n="type"></span><select id="fl-type" class="field"></select></label>
    <label class="block"><span class="lbl" data-i18n="status"></span><select id="fl-status" class="field"></select></label>
  </div>
  <div id="menu" class="pop" hidden></div>
</header>
<section class="pend px-3 py-2 flex items-center gap-3"><div id="featured" class="flex-1 min-w-0 flex items-center gap-2 overflow-x-auto" aria-live="polite"></div><nav id="socials" class="flex gap-1 shrink-0"></nav></section>
<main id="view" class="flex-1 min-h-0 flex flex-col p-2"></main>
<div id="modal" hidden></div>
<input type="file" id="import" accept="application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
